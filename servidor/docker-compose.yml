#docker compose --env-file .env up --build -d

#Caso for usar wal arquives descomente essa linha:
#- archive_command=/bin/cp %p /wal-archive/%f
#Erro possivel
#/bin/cp: cannot create regular file '/wal-archive/0000000100000004000000E2': Permission denied
# Descubra o UID do processo postgres dentro do container
# docker exec supabase-db id postgres
# sudo chown -R 105:106 ./volumes/db/wal_archives/
# sudo chmod -R 755 ./volumes/db/wal_archives/

x-vector-logging: &vector-logging
  driver: fluentd
  options:
    fluentd-address: ${VECTOR_FLUENTD_ADDRESS:-127.0.0.1:24224}
    fluentd-async: "true"
    fluentd-sub-second-precision: "true"

services:
  db:
    container_name: supabase-db
    build:
      context: ./volumes/db
    restart: unless-stopped
    logging: *vector-logging
    env_file:
      - .env
    networks:
      rede-supabase:
        ipv4_address: ${POSTGRES_HOST}
      analytics-internal:
      storage-control:
    volumes:
      - ./volumes/db/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:Z
      # Must be superuser to create event trigger
      - ./volumes/db/webhooks.sql:/docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql:Z
      # Must be superuser to alter reserved role
      - ./volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:Z
      # Initialize the database settings with JWT_SECRET and JWT_EXP
      - ./volumes/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:Z
      # PGDATA directory is persisted between restarts
      - ./volumes/db/data:/var/lib/postgresql/data:Z
      # Changes required for internal supabase data such as _analytics
      - ./volumes/db/_supabase.sql:/docker-entrypoint-initdb.d/migrations/97-_supabase.sql:Z
      # Changes required for Analytics support
      - ./volumes/db/logs.sql:/docker-entrypoint-initdb.d/migrations/99-logs.sql:Z
      # Changes required for Pooler support
      - ./volumes/db/pooler.sql:/docker-entrypoint-initdb.d/migrations/99-pooler.sql:Z
      #################################
      # create database template
      - ./volumes/db/create_template.sh://docker-entrypoint-initdb.d/zzz-create_template.sh:Z
      #################################
      # Use named volume to persist pgsodium decryption key between restarts
      - db-config:/etc/postgresql-custom
    healthcheck:
      test:
        [
        "CMD",
        "pg_isready",
        "-U",
        "postgres",
        "-h",
        "localhost"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: ${POSTGRES_PORT}
      POSTGRES_PORT: ${POSTGRES_PORT}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY}
    mem_limit: ${POSTGRES_MEM_LIMIT}
    memswap_limit: ${POSTGRES_MEMSWAP_LIMIT}
    shm_size: ${POSTGRES_SHM_SIZE}
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal
      - -c
      - max_connections=1000
      - -c
      - superuser_reserved_connections=5
      - -c
      - shared_buffers=4GB
      - -c
      - effective_cache_size=8GB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - work_mem=16MB
      - -c
      - wal_buffers=128MB
      - -c
      - temp_buffers=64MB
      - -c
      - max_stack_depth=7MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_sync_method=fdatasync
      - -c
      - synchronous_commit=on
      - -c
      - checkpoint_timeout=15min
      - -c
      - max_wal_size=8GB
      - -c
      - min_wal_size=2GB
      - -c
      - wal_level=logical
      - -c
      - default_statistics_target=500
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - seq_page_cost=1.0
      - -c
      - cpu_tuple_cost=0.01
      - -c
      - cpu_index_tuple_cost=0.005
      - -c
      - cpu_operator_cost=0.0025
      - -c
      - max_worker_processes=8
      - -c
      - max_parallel_workers=4
      - -c
      - max_parallel_workers_per_gather=2
      - -c
      - max_parallel_maintenance_workers=2
      - -c
      - statement_timeout=300000
      - -c
      - lock_timeout=30000
      - -c
      - idle_in_transaction_session_timeout=600000
      - -c
      - log_statement=none
      - -c
      - log_duration=off
      - -c
      - log_lock_waits=on
      - -c
      - log_temp_files=100MB
      - -c
      - log_min_duration_statement=1000
      - -c
      - 'log_line_prefix=%t [%p]: user=%u,db=%d,app=%a,client=%h'
      - -c
      - autovacuum_max_workers=4
      - -c
      - autovacuum_naptime=10s
      - -c
      - autovacuum_vacuum_scale_factor=0.1
      - -c
      - autovacuum_analyze_scale_factor=0.05
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=3600
      - -c
      - wal_keep_size=1GB
      - -c
      - max_replication_slots=32
      - -c
      - max_wal_senders=40
      - -c
      - tcp_keepalives_idle=60
      - -c
      - tcp_keepalives_interval=10
      - -c
      - tcp_keepalives_count=6

  realtime:
    build:
      context: .
      dockerfile: volumes/realtime/Dockerfile
    #This container name looks inconsistent but is correct because realtime constructs tenant id by parsing the subdomain
    container_name: realtime-dev.supabase-realtime
    #image: supabase/realtime:v2.34.41
    restart: unless-stopped
    logging: *vector-logging
    env_file:
      - .env
    networks:
      - rede-supabase
    depends_on:
      db:
        # Disable this if you are using an external Postgres database
        condition: service_healthy
    environment:
      # SLOT_NAME_SUFFIX: "_repl"
      PORT: ${REALTIME_PORT}
      DB_HOST: ${POSTGRES_HOST}
      #DB_PORT: 6543
      DB_PORT: ${POSTGRES_PORT}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: ${DB_ENC_KEY}
      API_JWT_SECRET: ${JWT_SECRET}
      METRICS_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      #Set to either "-proto_dist inet_tcp" or "-proto_dist inet6_tcp" depending on whether or not your network uses IPv4 or IPv6 respectively.
      ERL_AFLAGS: ${REALTIME_ERL_AFLAGS}
      DNS_NODES: "''"
      RLIMIT_NOFILE: ${REALTIME_RLIMIT_NOFILE}
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      SELF_HOST_TENANT_NAME: realtime-dev
      RUN_JANITOR: "true"
      NUM_ACCEPTORS: ${NUM_ACCEPTORS}
      TENANT_MAX_BYTES_PER_SECOND: ${REALTIME_TENANT_MAX_BYTES_PER_SECOND}
      TENANT_MAX_CHANNELS_PER_CLIENT: ${REALTIME_TENANT_MAX_CHANNELS_PER_CLIENT}
      TENANT_MAX_CONCURRENT_USERS: ${MAX_CONCURRENT_USERS}
      TENANT_MAX_EVENTS_PER_SECOND: ${REALTIME_TENANT_MAX_EVENTS_PER_SECOND}
      TENANT_MAX_JOINS_PER_SECOND: ${REALTIME_TENANT_MAX_JOINS_PER_SECOND}
      LOG_LEVEL: ${REALTIME_LOG_LEVEL}
      METRICS_ENABLED: ${REALTIME_METRICS_ENABLED}
      DASHBOARD_AUTH: basic_auth
      DASHBOARD_USER: ${DASHBOARD_USER}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD}

  supavisor:
    container_name: supabase-pooler
    image: ${POOLER_IMAGE}
    env_file:
      - .env
    restart: unless-stopped
    logging: *vector-logging
    networks:
      rede-supabase:
        ipv4_address: ${POSTGRES_POOLER}
      storage-control:
    volumes:
      - ./volumes/pooler/pooler.exs:/etc/pooler/pooler.exs:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--silent", "--show-error", "--output", "/dev/null", "http://localhost:4000"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    ulimits:
      nofile:
        soft: ${POOLER_NOFILE_SOFT}
        hard: ${POOLER_NOFILE_HARD}
    environment:
      PORT: ${POOLER_INTERNAL_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: ecto://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      CLUSTER_POSTGRES: "true"
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      VAULT_ENC_KEY: ${VAULT_ENC_KEY}
      API_JWT_SECRET: ${JWT_SECRET}
      METRICS_JWT_SECRET: ${JWT_SECRET}
      REGION: local
      ERL_AFLAGS: ${POOLER_ERL_AFLAGS}
      POOLER_DEFAULT_POOL_SIZE: ${POOLER_DEFAULT_POOL_SIZE}
      POOLER_MAX_CLIENT_CONN: ${POOLER_MAX_CLIENT_CONN}
      POOLER_POOL_MODE: ${POOLER_POOL_MODE}
    command:
      - /bin/sh
      - -c
      - |
        export PGPASSWORD="$POSTGRES_PASSWORD"
        psql \
          "host=$POSTGRES_HOST port=$POSTGRES_PORT user=$POSTGRES_USER dbname=$POSTGRES_DB sslmode=disable" \
          -c "CREATE SCHEMA IF NOT EXISTS _supavisor;" \
        && echo "Schema _supavisor OK" \
        && /app/bin/migrate \
        && /app/bin/supavisor eval "$$(cat /etc/pooler/pooler.exs)" \
        && /app/bin/server
  functions:
    container_name: supabase-edge-functions
    image: ${FUNCTIONS_IMAGE}
    env_file:
      - .env
    restart: unless-stopped
    logging: *vector-logging
    networks:
      - rede-supabase
    volumes:
      - ./volumes/functions:/home/deno/functions:Z
      - ./projects:/home/deno/projects:ro,Z
    depends_on:
      db:
        condition: service_healthy  
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SUPABASE_URL: ${FUNCTIONS_SUPABASE_URL}
      SUPABASE_ANON_KEY: ${FUNCTIONS_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${FUNCTIONS_SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_DB_URL: postgresql://${FUNCTIONS_DB_USER}:${POSTGRES_PASSWORD}@${POSTGRES_POOLER}:${POOLER_PROXY_PORT_TRANSACTION}/${POSTGRES_DB}
      VERIFY_JWT: "${FUNCTIONS_VERIFY_JWT}"
    command:
      [
      "start",
      "--main-service",
      "/home/deno/functions/main"
      ]

  storage:
    container_name: supabase-storage-global
    image: ${STORAGE_IMAGE:?defina STORAGE_IMAGE}
    restart: unless-stopped
    logging: *vector-logging
    user: ${STORAGE_RUN_AS_USER:?defina STORAGE_RUN_AS_USER}
    env_file:
      - .env
      - .storage.env
    networks:
      - storage-control
      - storage-data-plane
    volumes:
      - ./volumes/storage:/var/lib/storage:z
    depends_on:
      db:
        condition: service_healthy
      supavisor:
        condition: service_healthy
      imgproxy:
        condition: service_healthy
    environment:
      SERVER_PORT: 5000
      SERVER_REGION: local
      SERVER_ADMIN_PORT: 5001
      MULTI_TENANT: "true"
      DATABASE_MULTITENANT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/_supabase_storage
      ADMIN_RETURN_TENANT_SENSITIVE_DATA: "false"
      REQUEST_X_FORWARDED_HOST_REGEXP: ${STORAGE_TENANT_HOST_REGEXP:?defina STORAGE_TENANT_HOST_REGEXP}
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      REQUEST_TRACE_HEADER: x-request-id
      DB_INSTALL_ROLES: "false"
      PG_QUEUE_ENABLE: "true"
      DATABASE_FREE_POOL_AFTER_INACTIVITY: ${STORAGE_TENANT_POOL_IDLE_MS:?defina STORAGE_TENANT_POOL_IDLE_MS}
      STORAGE_BACKEND: ${STORAGE_BACKEND:?defina STORAGE_BACKEND}
      STORAGE_FILE_BACKEND_PATH: ${STORAGE_FILE_BACKEND_PATH:?defina STORAGE_FILE_BACKEND_PATH}
      STORAGE_S3_BUCKET: ${STORAGE_INTERNAL_BUCKET:?defina STORAGE_INTERNAL_BUCKET}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:?defina STORAGE_S3_REGION}
      UPLOAD_FILE_SIZE_LIMIT: ${STORAGE_FILE_SIZE_LIMIT:?defina STORAGE_FILE_SIZE_LIMIT}
      UPLOAD_FILE_SIZE_LIMIT_STANDARD: ${STORAGE_FILE_SIZE_LIMIT_STANDARD:?defina STORAGE_FILE_SIZE_LIMIT_STANDARD}
      TUS_URL_PATH: /upload/resumable
      IMAGE_TRANSFORMATION_ENABLED: ${STORAGE_IMAGE_TRANSFORMATION_ENABLED:?defina STORAGE_IMAGE_TRANSFORMATION_ENABLED}
      IMGPROXY_URL: http://imgproxy:5001
      S3_PROTOCOL_ENABLED: "true"
      VECTOR_ENABLED: ${STORAGE_VECTOR_ENABLED:?defina STORAGE_VECTOR_ENABLED}
      VECTOR_BUCKET_PROVIDER: pgvector
      VECTOR_DATABASE_CREATE: "false"
      VECTOR_STORE_MIGRATIONS_ENABLED: "true"
      VECTOR_MAX_BUCKETS: ${STORAGE_VECTOR_MAX_BUCKETS:?defina STORAGE_VECTOR_MAX_BUCKETS}
      VECTOR_MAX_INDEXES: ${STORAGE_VECTOR_MAX_INDEXES:?defina STORAGE_VECTOR_MAX_INDEXES}
      LOG_LEVEL: ${STORAGE_LOG_LEVEL:?defina STORAGE_LOG_LEVEL}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/status"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  imgproxy:
    container_name: supabase-imgproxy-global
    image: ${IMGPROXY_IMAGE:?defina IMGPROXY_IMAGE}
    restart: unless-stopped
    logging: *vector-logging
    networks:
      - storage-control
    volumes:
      - ./volumes/storage:/var/lib/storage:ro,z
    environment:
      IMGPROXY_BIND: ${IMGPROXY_BIND:?defina IMGPROXY_BIND}
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: ${IMGPROXY_LOCAL_FILESYSTEM_ROOT:?defina IMGPROXY_LOCAL_FILESYSTEM_ROOT}
      IMGPROXY_USE_ETAG: ${IMGPROXY_USE_ETAG:?defina IMGPROXY_USE_ETAG}
      IMGPROXY_ENABLE_WEBP_DETECTION: ${IMGPROXY_ENABLE_WEBP_DETECTION:?defina IMGPROXY_ENABLE_WEBP_DETECTION}
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  storage-data-plane:
    container_name: shared-storage-data-plane
    hostname: supabase-storage-global
    image: ${STORAGE_DATA_PLANE_PROXY_IMAGE:?defina STORAGE_DATA_PLANE_PROXY_IMAGE}
    restart: unless-stopped
    logging: *vector-logging
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;", "-c", "/etc/nginx/nginx.conf"]
    networks:
      storage-gateways:
        aliases:
          - supabase-storage-global
      storage-data-plane:
    volumes:
      - ./volumes/storage-proxy/nginx.conf:/etc/nginx/nginx.conf:ro,z
    depends_on:
      storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/status"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  analytics:
    build:
      context: .
      dockerfile: volumes/analytics/Dockerfile
    container_name: supabase-analytics
    restart: unless-stopped
    env_file:
      - .analytics.env
    networks:
      - analytics-internal
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sSfL -o /dev/null http://localhost:4000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    environment:
      LOGFLARE_NODE_HOST: ${LOGFLARE_NODE_HOST}
      DB_USERNAME: ${POSTGRES_USER}
      DB_DATABASE: _supabase
      DB_HOSTNAME: db
      DB_PORT: ${POSTGRES_PORT}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SCHEMA: _analytics
      LOGFLARE_SINGLE_TENANT: "true"
      LOGFLARE_SUPABASE_MODE: "true"
      LOGFLARE_FEATURE_FLAG_OVERRIDE: multibackend=true
      LOGFLARE_LOG_LEVEL: ${LOGFLARE_LOG_LEVEL}
      POSTGRES_BACKEND_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/_supabase
      POSTGRES_BACKEND_SCHEMA: _analytics

  vector:
    image: ${VECTOR_IMAGE}
    container_name: supabase-vector-global
    restart: unless-stopped
    volumes:
      - ./volumes/logs/vector.yml:/etc/vector/vector.yml:ro,z
    env_file:
      - .analytics.env
    ports:
      - "${VECTOR_FLUENTD_BIND:-127.0.0.1}:${VECTOR_FLUENTD_PORT:-24224}:24224"
    networks:
      - analytics-internal
    depends_on:
      analytics:
        condition: service_healthy
    command: ["--config", "/etc/vector/vector.yml"]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:9001/health"]
      interval: 5s
      timeout: 5s
      retries: 3

networks:
  rede-supabase:
    name: rede-supabase
    driver: bridge
    ipam:
      config:
        - subnet: ${SUPABASE_NETWORK_SUBNET}
          ip_range: ${SUPABASE_NETWORK_IP_RANGE}
          gateway: ${SUPABASE_NETWORK_GATEWAY}
  analytics-internal:
    name: supabase-analytics-internal
    driver: bridge
    internal: true
  storage-control:
    name: supabase-storage-control
    driver: bridge
    internal: true
  storage-gateways:
    name: supabase-storage-gateways
    driver: bridge
    internal: true
  storage-data-plane:
    name: supabase-storage-data-plane
    driver: bridge
    internal: true
volumes:
  db-config:
