# docker compose -f docker-compose-api.yml -f docker-compose.single-node.yml --env-file .env up --build -d
x-vector-logging: &vector-logging
  driver: fluentd
  options:
    fluentd-address: ${VECTOR_FLUENTD_ADDRESS:-127.0.0.1:24224}
    fluentd-async: "true"
    fluentd-sub-second-precision: "true"

services:
  control-plane-migrations:
    container_name: control-plane-migrations
    build:
      context: .
      dockerfile: ./api-internal/Dockerfile
    restart: "no"
    logging: *vector-logging
    networks: [rede-supabase]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
      DB_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      KEY_AUTHORIZER_DB_PASSWORD: ${KEY_AUTHORIZER_DB_PASSWORD:?defina KEY_AUTHORIZER_DB_PASSWORD}
      HOST_AGENT_DB_PASSWORD: ${HOST_AGENT_DB_PASSWORD:?defina HOST_AGENT_DB_PASSWORD}
      PLATFORM_APP_DB_PASSWORD: ${PLATFORM_APP_DB_PASSWORD:?defina PLATFORM_APP_DB_PASSWORD}
      META_ADMIN_DB_PASSWORD: ${META_ADMIN_DB_PASSWORD:?defina META_ADMIN_DB_PASSWORD}
    command: ["python", "-m", "app.schema_migrations", "apply"]

  key-authorizer:
    container_name: key-authorizer
    build:
      context: .
      dockerfile: ./key-authorizer/Dockerfile
    restart: unless-stopped
    logging: *vector-logging
    networks: [rede-supabase]
    expose: ["18010"]
    depends_on:
      control-plane-migrations:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DB_DSN: postgres://key_authorizer:${KEY_AUTHORIZER_DB_PASSWORD:?defina KEY_AUTHORIZER_DB_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18010/healthz', timeout=2)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  projects-api:
    container_name: projects-api
    build: 
      context: .
      dockerfile: ./api-internal/Dockerfile
    restart: unless-stopped
    logging: *vector-logging
    stop_grace_period: ${PROJECTS_API_STOP_GRACE_PERIOD}
    env_file:
      - .analytics.env
    networks: [rede-supabase, analytics-internal]
    expose: ["${PROJECTS_API_PORT}"]
    depends_on:
      control-plane-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18000/healthz', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      DB_DSN: postgres://platform_app:${PLATFORM_APP_DB_PASSWORD:?defina PLATFORM_APP_DB_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      META_ADMIN_DSN: postgres://platform_meta_admin:${META_ADMIN_DB_PASSWORD:?defina META_ADMIN_DB_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      PLATFORM_READER_DB_PASSWORD: ${PLATFORM_READER_DB_PASSWORD:?defina PLATFORM_READER_DB_PASSWORD}
      HOST_AGENT_HMAC_SECRET: ${HOST_AGENT_HMAC_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      PROJECT_SECRETS_MASTER_KEY: ${PROJECT_SECRETS_MASTER_KEY}
      PROJECT_SECRETS_MASTER_KEY_ID: ${PROJECT_SECRETS_MASTER_KEY_ID}
      PROJECT_SECRETS_PREVIOUS_MASTER_KEYS: ${PROJECT_SECRETS_PREVIOUS_MASTER_KEYS}
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
      STUDIO_SERVICE_KEY_ENCRYPTION_KEY: ${STUDIO_SERVICE_KEY_ENCRYPTION_KEY}
      NGINX_HMAC_SECRET: ${NGINX_HMAC_SECRET}
      STUDIO_GATEWAY_HMAC_SECRET: ${STUDIO_GATEWAY_HMAC_SECRET:?defina STUDIO_GATEWAY_HMAC_SECRET}
      PROJECTS_API_HMAC_SECRET: ${PROJECTS_API_HMAC_SECRET:?defina PROJECTS_API_HMAC_SECRET}
      INTERNAL_HMAC_MAX_SKEW_SECONDS: ${INTERNAL_HMAC_MAX_SKEW_SECONDS:-60}
      USER_TOKEN_MAX_CLOCK_SKEW_SECONDS: ${USER_TOKEN_MAX_CLOCK_SKEW_SECONDS}
      KEY_EXPIRY_WARNING_DAYS: ${KEY_EXPIRY_WARNING_DAYS}
      AUTOMATIC_KEY_ROTATION_LEAD_DAYS: ${AUTOMATIC_KEY_ROTATION_LEAD_DAYS:?defina AUTOMATIC_KEY_ROTATION_LEAD_DAYS}
      AUTOMATIC_KEY_ROTATION_CHECK_INTERVAL_SECONDS: ${AUTOMATIC_KEY_ROTATION_CHECK_INTERVAL_SECONDS:?defina AUTOMATIC_KEY_ROTATION_CHECK_INTERVAL_SECONDS}
      AUTOMATIC_KEY_ROTATION_MAX_CONCURRENT: ${AUTOMATIC_KEY_ROTATION_MAX_CONCURRENT:?defina AUTOMATIC_KEY_ROTATION_MAX_CONCURRENT}
      STUDIO_CACHE_INVALIDATION_URL: https://nginx:443
      STUDIO_CACHE_INVALIDATION_VERIFY_TLS: ${STUDIO_CACHE_INVALIDATION_VERIFY_TLS:-true}
      STUDIO_CACHE_INVALIDATION_CA_FILE: ${STUDIO_CACHE_INVALIDATION_CA_FILE:-/docker/push-certs/ca.pem}
      PG_META_INTERNAL_URL: http://postgres-meta-global:8080
      PG_META_ALLOWED_HOSTS: postgres-meta-global
      ANALYTICS_INTERNAL_URL: http://analytics:4000
    volumes:
      - ./projects:/docker/projects:rw        # bind-mount relativo  :contentReference[oaicite:0]{index=0}
      - ./certs:/docker/push-certs:ro
      - ./.env:/docker/.env:ro
  postgres-meta-global:
    container_name: postgres-meta-global
    image: ${PG_META_IMAGE}
    restart: unless-stopped
    logging: *vector-logging
    networks: [rede-supabase]
    expose: ["${PG_META_PORT}"]
    environment:
      PG_META_PORT: ${PG_META_PORT}
      PG_META_DB_HOST: ${POSTGRES_HOST}
      PG_META_DB_PORT: ${POSTGRES_PORT}
      PG_META_DB_NAME: meta_trap
      PG_META_DB_USER: meta_guest
      PG_META_DB_PASSWORD: ${META_GUEST_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
