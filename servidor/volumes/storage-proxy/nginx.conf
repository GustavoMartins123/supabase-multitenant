worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    map $http_x_forwarded_host $storage_tenant_host_valid {
        default 0;
        "~^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}[.]storage[.]internal$" 1;
    }

    log_format storage_data escape=json
        '{"remote":"$remote_addr","method":"$request_method","uri":"$uri",'
        '"status":$status,"tenant_host":"$http_x_forwarded_host",'
        '"request_id":"$http_x_request_id"}';
    access_log /dev/stdout storage_data;
    server_tokens off;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    upstream shared_storage_data_plane {
        server storage:5000;
        keepalive 32;
    }

    server {
        listen 5000;
        client_max_body_size 0;

        location = /status {
            access_log off;
            proxy_pass http://shared_storage_data_plane;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location / {
            if ($storage_tenant_host_valid = 0) {
                return 421;
            }

            proxy_pass http://shared_storage_data_plane;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
        }
    }
}
