worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=30s ipv6=off;

    map $http_authorization $vector_sigv4_header_valid {
        default 0;
        "~^AWS4-HMAC-SHA256 Credential=[^/,\s]+/[0-9]{8}/[^/,\s]+/s3vectors/aws4_request,\s*SignedHeaders=[^,\s]+,\s*Signature=[0-9a-fA-F]{64}$" 1;
    }

    map $http_x_amz_date $vector_amz_date_valid {
        default 0;
        "~^[0-9]{8}T[0-9]{6}Z$" 1;
    }

    map "$vector_sigv4_header_valid:$vector_amz_date_valid" $vector_sigv4_valid {
        default 0;
        "1:1"   1;
    }

    map "" $storage_vector_upstream {
        default "storage:5000";
    }

    map $request_uri $fdw_log_tenant {
        default "";
        "~^/fdw/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/vector/" $1;
    }

    log_format storage_vector_fdw escape=json
        '{"remote":"$remote_addr","method":"$request_method","uri":"$uri",'
        '"status":$status,"tenant":"$fdw_log_tenant",'
        '"request_id":"$http_x_request_id"}';
    access_log /dev/stdout storage_vector_fdw;
    server_tokens off;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8081;
        client_max_body_size 25m;

        location = /healthz {
            access_log off;
            if ($request_method !~ ^(GET|HEAD)$) {
                return 405;
            }
            default_type text/plain;
            return 200 "ok\n";
        }

        location ~ "^/fdw/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/vector/([A-Za-z]+)$" {
            set $fdw_tenant_uuid $1;
            set $fdw_vector_op $2;

            if ($request_method != POST) {
                return 405;
            }
            if ($vector_sigv4_valid = 0) {
                return 403;
            }

            client_max_body_size 25m;

            rewrite ^ /vector/$fdw_vector_op break;

            proxy_pass http://$storage_vector_upstream;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host "$fdw_tenant_uuid.storage.internal";
            proxy_set_header X-Forwarded-Prefix "/fdw/$fdw_tenant_uuid";
            proxy_set_header X-Forwarded-Proto http;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header apikey "";
            proxy_set_header Forwarded "";
            proxy_set_header Connection "";
        }

        location / {
            return 403;
        }
    }
}
