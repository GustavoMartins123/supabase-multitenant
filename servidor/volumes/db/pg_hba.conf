# Hardened host-based authentication configuration for PostgreSQL (SEC-11)
# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             supabase_admin                          trust
local   all             all                                     peer map=supabase_map
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256
# Docker network CIDRs are appended dynamically at container startup by configure-pg-hba.sh
host    all             all             0.0.0.0/0               reject
host    all             all             ::/0                    reject
