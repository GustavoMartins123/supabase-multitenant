name: Temporary finalize strict HMAC cleanup

on:
  push:
    branches: [opaque-keys]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: opaque-keys
          fetch-depth: 50

      - name: Remove applicator artifacts and validate final tree
        shell: bash
        run: |
          set -euo pipefail

          # Reverte a mudança acidental de CRLF que não fazia parte do hardening.
          git checkout 8a90f9cc37943c719f3f3d641343be38e60b610b -- docs/08-erro-setup-crlf.md

          # O gerador temporário deixou um backslash antes do shebang. Corrige e
          # garante que a migração possa ser executada diretamente.
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/migrate_internal_hmac_v1.py')
          content = path.read_text(encoding='utf-8')
          if content.startswith('\\\n'):
              content = content[2:]
          if not content.startswith('#!/usr/bin/env python3\n'):
              raise SystemExit('migrate_internal_hmac_v1.py: shebang inválido')
          path.write_text(content, encoding='utf-8', newline='\n')
          path.chmod(0o755)
          PY

          # Os workflows abaixo existiram somente para aplicar/auditar a mudança.
          rm -f \
            .github/workflows/tmp-audit-legacy-token.yml \
            .github/workflows/tmp-apply-hard-hmac-cutover.yml \
            .github/workflows/tmp-apply-hard-hmac-cutover-v2.yml \
            .github/workflows/tmp-apply-hard-hmac-cutover-v3.yml \
            .github/workflows/tmp-apply-hard-hmac-cutover-v4.yml \
            .github/workflows/tmp-apply-hard-hmac-cutover-v5.yml \
            .github/workflows/tmp-finalize-hard-hmac.yml

          # Nenhum bearer/fallback antigo pode sobreviver no runtime/configuração.
          runtime_paths=(
            servidor/api-internal/app
            servidor/traefik
            studio/nginx
            servidor/docker-compose-api.yml
            servidor/.env.example
            studio/.env.example
            setup.sh
            servidor/verify_key_config.sh
          )
          for token in \
            NGINX_SHARED_TOKEN \
            X-Shared-Token \
            INTERNAL_HMAC_ALLOW_LEGACY_SHARED_TOKEN \
            X-Internal-Caller \
            security.shared_token \
            nginx_shared_token; do
            if grep -RIn --binary-files=without-match -- "$token" "${runtime_paths[@]}"; then
              echo "ERRO: referência legada '$token' permaneceu no runtime" >&2
              exit 1
            fi
          done

          if grep -RIn --binary-files=without-match -- 'rewrite ^/object/sign$ /storage/v1/$1 break;' studio/nginx; then
            echo 'ERRO: rewrite morto de object/sign permaneceu' >&2
            exit 1
          fi

          test ! -e studio/nginx/lua/security/shared_token.lua
          test ! -e studio/nginx/lua/security/nginx_shared_token.lua

          # O script de migração é a única ponte para instalações antigas.
          grep -q 'STUDIO_GATEWAY_HMAC_SECRET' tools/migrate_internal_hmac_v1.py
          grep -q 'PROJECTS_API_HMAC_SECRET' tools/migrate_internal_hmac_v1.py
          grep -q 'NGINX_SHARED_TOKEN' tools/migrate_internal_hmac_v1.py
          ./tools/migrate_internal_hmac_v1.py --help >/dev/null

          python3 -m compileall -q servidor/api-internal/app tools tests/smoke
          python3 -m unittest \
            tests.smoke.test_internal_hmac_migration \
            tests.smoke.test_traefik_guard_migration \
            tests.smoke.test_studio_runtime_contract \
            tests.smoke.test_key_generation_contract \
            tests.smoke.test_service_key_cache_contract \
            tests.smoke.test_storage_platform_router
          python3 -m pip install -q -r servidor/api-internal/requirements.txt
          python3 -m unittest tests.smoke.test_hmac_contracts
          git diff --check

      - name: Commit final cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Gustavo Henrique Martins"
          git config user.email "99695758+GustavoMartins123@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "chore: finalize strict HMAC cutover cleanup"
          git push origin HEAD:opaque-keys
