name: Temporary legacy-token audit

on:
  push:
    branches: [opaque-keys]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: opaque-keys
      - name: Find legacy shared-token references
        shell: bash
        run: |
          set -euo pipefail
          echo '=== NGINX_SHARED_TOKEN ==='
          grep -RIn --exclude-dir=.git -- 'NGINX_SHARED_TOKEN' . || true
          echo '=== X-Shared-Token ==='
          grep -RIn --exclude-dir=.git -- 'X-Shared-Token' . || true
          echo '=== security.shared_token / nginx_shared_token ==='
          grep -RIn --exclude-dir=.git -E 'security\.shared_token|nginx_shared_token' . || true
          echo '=== object/sign legacy rewrite ==='
          grep -RIn --exclude-dir=.git -- 'rewrite ^/object/sign$ /storage/v1/$1 break;' . || true
