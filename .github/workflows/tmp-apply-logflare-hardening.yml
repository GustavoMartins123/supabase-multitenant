name: Temporary Logflare hardening executor

on:
  push:
    branches: [opaque-keys]

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: opaque-keys
          fetch-depth: 20

      - name: Apply staged hardening
        shell: bash
        run: |
          set -euo pipefail
          git show f61d94cc32363b732533b7dfe5dea695851b7c65:.github/workflows/tmp-apply-logflare-hardening.yml > /tmp/staged.yml
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('/tmp/staged.yml').read_text(encoding='utf-8')
          section = workflow.split('      - name: Apply Logflare hardening\n', 1)[1]
          section = section.split('      - name: Validate hardening\n', 1)[0]
          body = section.split('        run: |\n', 1)[1]
          lines = body.splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply-logflare.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/apply-logflare.sh

      - name: Validate hardening
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq luajit
          python3 -m compileall -q servidor/api-internal/app tools tests/smoke
          python3 -m unittest \
            tests.smoke.test_global_admin_and_analytics_contract \
            tests.smoke.test_internal_service_hmac_config \
            tests.smoke.test_studio_analytics_hmac_migration
          node tests/smoke/test_studio_logflare_hmac_hook.cjs
          luajit -b studio/nginx/lua/security/logflare_internal_guard.lua /tmp/logflare_internal_guard.luac
          luajit -b studio/nginx/lua/security/upload_route_guard.lua /tmp/upload_route_guard.luac
          ./tools/migrate_studio_analytics_hmac.py --help >/dev/null
          git diff --check
          ! grep -A45 'location ~ ^/_internal/logflare/' studio/nginx/nginx.conf | grep -F '$http_authorization'
          ! grep -A45 'location ~ ^/_internal/logflare/' studio/nginx/nginx.conf | grep -F '$http_x_api_key'

      - name: Commit final tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Gustavo Henrique Martins"
          git config user.email "99695758+GustavoMartins123@users.noreply.github.com"
          git rm .github/workflows/tmp-apply-logflare-hardening.yml
          rm -f .github/.logflare-hardening-trigger
          git add -A
          git commit -m "security: harden internal Logflare proxy"
          git push origin HEAD:opaque-keys
