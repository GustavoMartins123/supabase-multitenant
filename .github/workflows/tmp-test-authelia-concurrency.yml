name: Temporary Authelia concurrency validation

on:
  push:
    branches: [opaque-keys]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: opaque-keys
          fetch-depth: 10
      - name: Install LuaJIT
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq luajit
          sudo mkdir -p /config
          sudo chmod 0777 /config
      - name: Static concurrency contracts
        run: python3 -m unittest tests.smoke.test_authelia_yaml_concurrency_contract
      - name: Real cross-process flock and atomic-write probe
        shell: bash
        run: |
          set -euo pipefail
          target=/tmp/authelia-users-concurrency.yml
          printf 'base\n' > "$target"

          luajit tests/smoke/test_authelia_file_store_runtime.lua "$target" mutation-a 0.40 &
          p1=$!
          sleep 0.05
          luajit tests/smoke/test_authelia_file_store_runtime.lua "$target" mutation-b 0 &
          p2=$!
          wait "$p1"
          wait "$p2"

          test "$(grep -c '^mutation-a$' "$target")" -eq 1
          test "$(grep -c '^mutation-b$' "$target")" -eq 1
          test "$(wc -l < "$target")" -eq 3
          cat "$target"
      - name: Repository diff sanity
        run: git diff --check
      - name: Remove temporary workflow after successful validation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Gustavo Henrique Martins"
          git config user.email "99695758+GustavoMartins123@users.noreply.github.com"
          git rm .github/workflows/tmp-test-authelia-concurrency.yml
          git commit -m "chore: remove temporary Authelia concurrency workflow"
          git push origin HEAD:opaque-keys
