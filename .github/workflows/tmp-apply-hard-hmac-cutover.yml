          SERVICE_KEYS = ("STUDIO_GATEWAY_HMAC_SECRET", "PROJECTS_API_HMAC_SECRET")
          REMOVED_KEYS = ("NGINX_SHARED_TOKEN", "INTERNAL_HMAC_ALLOW_LEGACY_SHARED_TOKEN")


          class MigrationError(RuntimeError):
