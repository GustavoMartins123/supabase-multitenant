name: Temporary strict internal HMAC cutover

on:
  push:
    branches: [opaque-keys]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: opaque-keys
          fetch-depth: 1

      - name: Apply strict HMAC cutover
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import re
          import textwrap
          from pathlib import Path

          ROOT = Path.cwd()

          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding="utf-8")

          def write(path: str, content: str) -> None:
              (ROOT / path).write_text(content, encoding="utf-8")

          def replace_exact(path: str, old: str, new: str, *, expected: int = 1) -> None:
              content = read(path)
              count = content.count(old)
              if count != expected:
                  raise AssertionError(f"{path}: expected {expected} occurrence(s), found {count}: {old!r}")
              write(path, content.replace(old, new))

          def regex_replace(path: str, pattern: str, replacement: str, *, expected: int | None = None, flags: int = 0) -> int:
              content = read(path)
              updated, count = re.subn(pattern, replacement, content, flags=flags)
              if expected is not None and count != expected:
                  raise AssertionError(f"{path}: regex expected {expected}, found {count}: {pattern!r}")
              if count:
                  write(path, updated)
              return count

          # ------------------------------------------------------------------
          # Projects API: strict service HMAC only.
          # ------------------------------------------------------------------
          runtime = read("servidor/api-internal/app/runtime_config.py")
          runtime = runtime.replace("import hashlib\nimport hmac\n", "import hmac\n")
          runtime, count = re.subn(
              r"\ndef _derive_internal_service_secret\(.*?\n\n\nDB_DSN =",
              "\nDB_DSN =",
              runtime,
              flags=re.S,
          )
          if count != 1:
              raise AssertionError(f"runtime_config.py: derive helper removal count={count}")
          old_block = '''NGINX_SHARED_TOKEN = os.getenv("NGINX_SHARED_TOKEN")
          NGINX_HMAC_SECRET = os.getenv("NGINX_HMAC_SECRET")
          STUDIO_GATEWAY_HMAC_SECRET = (
              os.getenv("STUDIO_GATEWAY_HMAC_SECRET")
              or _derive_internal_service_secret(NGINX_HMAC_SECRET, "studio-gateway")
          )
          PROJECTS_API_HMAC_SECRET = (
              os.getenv("PROJECTS_API_HMAC_SECRET")
              or _derive_internal_service_secret(NGINX_HMAC_SECRET, "projects-api")
          )
          INTERNAL_HMAC_MAX_SKEW_SECONDS = _read_bounded_integer(
              "INTERNAL_HMAC_MAX_SKEW_SECONDS", default=60, minimum=5
          )
          INTERNAL_HMAC_ALLOW_LEGACY_SHARED_TOKEN = os.getenv(
              "INTERNAL_HMAC_ALLOW_LEGACY_SHARED_TOKEN", "true"
          ).strip().lower() in {"1", "true", "yes", "on"}
          '''
          new_block = '''NGINX_HMAC_SECRET = os.getenv("NGINX_HMAC_SECRET")
          STUDIO_GATEWAY_HMAC_SECRET = os.getenv("STUDIO_GATEWAY_HMAC_SECRET")
          PROJECTS_API_HMAC_SECRET = os.getenv("PROJECTS_API_HMAC_SECRET")
          INTERNAL_HMAC_MAX_SKEW_SECONDS = _read_bounded_integer(
              "INTERNAL_HMAC_MAX_SKEW_SECONDS", default=60, minimum=5
          )
          '''
          if old_block not in runtime:
              raise AssertionError("runtime_config.py: expected service-secret compatibility block not found")
          runtime = runtime.replace(old_block, new_block)
          runtime = runtime.replace('    "NGINX_SHARED_TOKEN": NGINX_SHARED_TOKEN,\n', "")
          runtime, count = re.subn(
              r'\nfor key_name, key_value in \{\n    "STUDIO_GATEWAY_HMAC_SECRET": STUDIO_GATEWAY_HMAC_SECRET,\n    "PROJECTS_API_HMAC_SECRET": PROJECTS_API_HMAC_SECRET,\n\}\.items\(\):\n    if hmac\.compare_digest\(key_value, NGINX_SHARED_TOKEN\):\n        raise RuntimeError\(f"\{key_name\} must be distinct from NGINX_SHARED_TOKEN"\)\n',
              "\n",
              runtime,
          )
          if count != 1:
              raise AssertionError(f"runtime_config.py: shared-token distinctness block count={count}")
          if "NGINX_SHARED_TOKEN" in runtime or "INTERNAL_HMAC_ALLOW_LEGACY_SHARED_TOKEN" in runtime or "_derive_internal_service_secret" in runtime:
              raise AssertionError("runtime_config.py still contains legacy shared-token fallback")
          write("servidor/api-internal/app/runtime_config.py", runtime)

          write("servidor/api-internal/app/internal_service_auth.py", textwrap.dedent('''\
          """Autenticacao HMAC de chamadas Studio Gateway -> Projects API.

          A identidade do servico e vinculada ao metodo, request-target, timestamp,
          nonce e hash do body. A identidade/autorizacao do usuario permanece uma
          camada separada por X-User-Token nas rotas que representam acoes humanas.
          """

          from __future__ import annotations

          import asyncio
          import re
          import time
          from collections import OrderedDict

          from fastapi import Request
          from fastapi.responses import JSONResponse
          from starlette.middleware.base import BaseHTTPMiddleware, RequestResponseEndpoint
          from starlette.responses import Response

          from app.internal_hmac import (
              INTERNAL_HMAC_VERSION,
              request_target_from_scope,
              verify_internal_hmac_signature,
          )
          from app.runtime_config import (
              INTERNAL_HMAC_MAX_SKEW_SECONDS,
              STUDIO_GATEWAY_HMAC_SECRET,
          )

          _NONCE_RE = re.compile(r"^[0-9a-fA-F]{32,128}$")
          _SIGNATURE_RE = re.compile(r"^[0-9a-fA-F]{64}$")
          _nonce_lock = asyncio.Lock()
          _nonce_expirations: OrderedDict[str, float] = OrderedDict()
          _MAX_TRACKED_NONCES = 20_000


          def _json_error(status_code: int, detail: str) -> JSONResponse:
              return JSONResponse(status_code=status_code, content={"detail": detail})


          async def _claim_nonce(service: str, nonce: str, *, now: float) -> bool:
              """Registra nonce por toda a janela na qual o timestamp seria aceito."""
              ttl = INTERNAL_HMAC_MAX_SKEW_SECONDS * 2 + 5
              cache_key = f"{service}:{nonce.lower()}"
              async with _nonce_lock:
                  while _nonce_expirations:
                      first_key, expires_at = next(iter(_nonce_expirations.items()))
                      if expires_at > now and len(_nonce_expirations) <= _MAX_TRACKED_NONCES:
                          break
                      _nonce_expirations.pop(first_key, None)

                  current_expiry = _nonce_expirations.get(cache_key)
                  if current_expiry is not None and current_expiry > now:
                      return False

                  _nonce_expirations[cache_key] = now + ttl
                  _nonce_expirations.move_to_end(cache_key)
                  while len(_nonce_expirations) > _MAX_TRACKED_NONCES:
                      _nonce_expirations.popitem(last=False)
                  return True


          async def authenticate_internal_request(request: Request) -> JSONResponse | None:
              """Exige internal-hmac-v1 em toda a Projects API, exceto healthz."""
              if request.url.path == "/healthz":
                  return None

              headers = request.headers
              version = headers.get("X-Internal-Version") or ""
              service = headers.get("X-Internal-Service") or ""
              raw_timestamp = headers.get("X-Internal-Timestamp") or ""
              nonce = headers.get("X-Internal-Nonce") or ""
              signature = headers.get("X-Internal-Signature") or ""

              if version != INTERNAL_HMAC_VERSION:
                  return _json_error(401, "Unauthorized: Missing or unsupported internal HMAC version")
              if service != "studio-gateway":
                  return _json_error(403, "Forbidden: Internal service is not allowed")
              if not _NONCE_RE.fullmatch(nonce):
                  return _json_error(401, "Unauthorized: Invalid internal HMAC nonce")
              if not _SIGNATURE_RE.fullmatch(signature):
                  return _json_error(401, "Unauthorized: Invalid internal HMAC signature")

              try:
                  timestamp = int(raw_timestamp)
              except ValueError:
                  return _json_error(401, "Unauthorized: Invalid internal HMAC timestamp")

              now = int(time.time())
              if abs(now - timestamp) > INTERNAL_HMAC_MAX_SKEW_SECONDS:
                  return _json_error(401, "Unauthorized: Expired internal HMAC signature")

              body = await request.body()
              target = request_target_from_scope(request.scope)
              if not verify_internal_hmac_signature(
                  STUDIO_GATEWAY_HMAC_SECRET,
                  service=service,
                  method=request.method,
                  target=target,
                  body=body,
                  timestamp=timestamp,
                  nonce=nonce,
                  signature=signature,
                  version=version,
              ):
                  return _json_error(403, "Forbidden: Invalid internal HMAC signature")

              if not await _claim_nonce(service, nonce, now=float(now)):
                  return _json_error(401, "Unauthorized: Replayed internal HMAC signature")

              request.state.internal_service = service
              return None


          class InternalServiceAuthenticationMiddleware(BaseHTTPMiddleware):
              """Camada externa que valida a identidade criptografica do caller."""

              async def dispatch(
                  self,
                  request: Request,
                  call_next: RequestResponseEndpoint,
              ) -> Response:
                  auth_error = await authenticate_internal_request(request)
                  if auth_error is not None:
                      return auth_error
                  return await call_next(request)
          '''))

          main = read("servidor/api-internal/app/main.py")
          main = main.replace(
              "KEY_EXPIRY_WARNING_DAYS, NGINX_HMAC_SECRET, NGINX_SHARED_TOKEN, PG_META_CRYPTO_KEY,",
              "KEY_EXPIRY_WARNING_DAYS, NGINX_HMAC_SECRET, PG_META_CRYPTO_KEY,",
          )
          main, count = re.subn(
              r'\n@app\.middleware\("http"\)\nasync def validate_shared_token\(request: Request, call_next\):.*?\n    return response\n',
              "\n",
              main,
              flags=re.S,
          )
          if count != 1:
              raise AssertionError(f"main.py: legacy middleware removal count={count}")
          if "X-Shared-Token" in main or "NGINX_SHARED_TOKEN" in main or "validate_shared_token" in main:
              raise AssertionError("main.py still contains legacy shared-token middleware")
          write("servidor/api-internal/app/main.py", main)

          hmac_py = read("servidor/api-internal/app/internal_hmac.py")
          hmac_py = hmac_py.replace("LEGACY_PUSH_HMAC_VERSION", "PUSH_HMAC_VERSION")
          hmac_py = hmac_py.replace(
              "        # Compatibilidade com o contrato ja publicado do push-worker.\n",
              "        # Contrato publicado do push-worker, separado do HMAC entre servicos.\n",
          )
          hmac_py = hmac_py.replace(
              '        headers["X-Internal-Caller"] = service\n',
              "",
          )
          if "X-Internal-Caller" in hmac_py or "LEGACY_PUSH_HMAC_VERSION" in hmac_py:
              raise AssertionError("internal_hmac.py still contains compatibility aliases")
          write("servidor/api-internal/app/internal_hmac.py", hmac_py)

          asgi = read("servidor/api-internal/app/asgi.py")
          asgi = asgi.replace(
              "# Registrado por ultimo para ser a camada mais externa: valida a identidade\n# criptografica do caller antes do middleware legado definido em app.main.\n",
              "# Registrado por ultimo para ser a camada mais externa: valida a identidade\n# criptografica do caller antes das rotas e dependencias da aplicacao.\n",
          )
          write("servidor/api-internal/app/asgi.py", asgi)

          # ------------------------------------------------------------------
          # Studio/OpenResty: HMAC only; no bearer bridge or alias.
          # ------------------------------------------------------------------
          lua_hmac = read("studio/nginx/lua/security/internal_hmac.lua")
          lua_hmac = lua_hmac.replace(
              '        -- Compatibilidade com locations antigas que zeram X-Internal-Service.\n        -- O valor continua protegido porque a identidade entra no canonical HMAC.\n        ["X-Internal-Caller"] = service,\n',
              "",
          )
          lua_hmac = lua_hmac.replace(
              '    local service = get_header(headers, "X-Internal-Service")\n        or get_header(headers, "X-Internal-Caller")\n        or ""\n',
              '    local service = get_header(headers, "X-Internal-Service") or ""\n',
          )
          if "X-Internal-Caller" in lua_hmac:
              raise AssertionError("internal_hmac.lua still contains compatibility caller alias")
          write("studio/nginx/lua/security/internal_hmac.lua", lua_hmac)

          signer = read("studio/nginx/lua/security/projects_api_signer.lua")
          signer = signer.replace('        "X-Internal-Caller",\n', "")
          if "X-Internal-Caller" in signer:
              raise AssertionError("projects_api_signer.lua still contains compatibility caller alias")
          write("studio/nginx/lua/security/projects_api_signer.lua", signer)

          write("studio/nginx/lua/cache/service_key_metrics.lua", textwrap.dedent('''\
          local cjson = require("cjson.safe")
          local internal_hmac = require("security.internal_hmac")

          if ngx.req.get_method() ~= "GET" then
              return ngx.exit(ngx.HTTP_METHOD_NOT_ALLOWED)
          end

          local secret = os.getenv("PROJECTS_API_HMAC_SECRET") or ""
          local max_skew = tonumber(os.getenv("INTERNAL_HMAC_MAX_SKEW_SECONDS")) or 60
          local ok, verify_status = internal_hmac.verify_current_request(
              secret,
              "projects-api",
              { max_skew = max_skew }
          )
          if not ok then
              return ngx.exit(verify_status or ngx.HTTP_FORBIDDEN)
          end

          local metrics = ngx.shared.service_key_metrics
          ngx.header.content_type = "application/json"
          ngx.say(cjson.encode({
              hit = metrics:get("hit") or 0,
              miss = metrics:get("miss") or 0,
              version_reload = metrics:get("version_reload") or 0,
              invalidation = metrics:get("invalidation") or 0,
              fetch_error = metrics:get("fetch_error") or 0,
              fetch_error_backoff = metrics:get("fetch_error_backoff") or 0,
              stale_fetch = metrics:get("stale_fetch") or 0,
              version_check_error = metrics:get("version_check_error") or 0,
          }))
          '''))

          studio_context = read("studio/nginx/lua/project_context/studio_context.lua")
          studio_context = studio_context.replace(
              'local http = require("resty.http")\n',
              'local http = require("resty.http")\nlocal internal_hmac = require("security.internal_hmac")\n',
          )
          studio_context = studio_context.replace(
              'local shared_token = os.getenv("NGINX_SHARED_TOKEN") or ""\n',
              'local service_hmac_secret = os.getenv("STUDIO_GATEWAY_HMAC_SECRET") or ""\n',
          )
          studio_context = studio_context.replace(
              '    if server_domain == "" or shared_token == "" then\n',
              '    if server_domain == "" or service_hmac_secret == "" then\n',
          )
          old_request = '''    local httpc = http.new()
              httpc:set_timeout(2000)
              local response, request_err = httpc:request_uri(
                  server_domain .. "/api/projects/internal/studio-context/" .. ref,
                  {
                      method = "GET",
                      headers = {
                          ["Accept"] = "application/json",
                          ["Host"] = server_hostname,
                          ["X-Internal-Service"] = "studio-nginx",
                          ["X-Shared-Token"] = shared_token,
                          ["X-User-Token"] = user_token,
                      },
                      ssl_verify = verify_tls,
                      ssl_server_name = server_hostname,
                      keepalive = true,
                  }
              )
          '''
          new_request = '''    local target = "/api/projects/internal/studio-context/" .. ref
              local signed_headers, sign_err = internal_hmac.sign_headers(
                  service_hmac_secret,
                  "studio-gateway",
                  "GET",
                  target,
                  ""
              )
              if not signed_headers then
                  return nil, sign_err or "failed to sign Studio context request", ngx.HTTP_INTERNAL_SERVER_ERROR
              end
              signed_headers["Accept"] = "application/json"
              signed_headers["Host"] = server_hostname
              signed_headers["X-User-Token"] = user_token

              local httpc = http.new()
              httpc:set_timeout(2000)
              local response, request_err = httpc:request_uri(
                  server_domain .. target,
                  {
                      method = "GET",
                      headers = signed_headers,
                      ssl_verify = verify_tls,
                      ssl_server_name = server_hostname,
                      keepalive = true,
                  }
              )
          '''
          if old_request not in studio_context:
              raise AssertionError("studio_context.lua: legacy request block not found")
          studio_context = studio_context.replace(old_request, new_request)
          if "NGINX_SHARED_TOKEN" in studio_context or "X-Shared-Token" in studio_context or '"studio-nginx"' in studio_context:
              raise AssertionError("studio_context.lua still contains shared-token caller")
          write("studio/nginx/lua/project_context/studio_context.lua", studio_context)

          identity = read("studio/nginx/lua/studio_compat/content_project_identity.lua")
          identity = identity.replace(
              'local outbound_tls = require("utils.outbound_tls")\n',
              'local outbound_tls = require("utils.outbound_tls")\nlocal internal_hmac = require("security.internal_hmac")\n',
          )
          identity = identity.replace(
              'local SHARED_TOKEN = os.getenv("NGINX_SHARED_TOKEN") or ""\n',
              'local SERVICE_HMAC_SECRET = os.getenv("STUDIO_GATEWAY_HMAC_SECRET") or ""\n',
          )
          identity = identity.replace(
              '    if SERVER_DOMAIN == "" or SHARED_TOKEN == "" then\n',
              '    if SERVER_DOMAIN == "" or SERVICE_HMAC_SECRET == "" then\n',
          )
          old_identity_request = '''    local client = http.new()
              client:set_timeout(2000)
              local response, err = client:request_uri(
                  SERVER_DOMAIN
                      .. "/api/projects/internal/content-identity/"
                      .. ngx.escape_uri(project_ref),
                  outbound_tls.apply_internal(SERVER_DOMAIN, {
                      method = "GET",
                      headers = {
                          ["Accept"] = "application/json",
                          ["Host"] = SERVER_HOSTNAME,
                          ["X-Shared-Token"] = SHARED_TOKEN,
                          ["X-Internal-Service"] = "studio-nginx",
                      },
                      keepalive = true,
                  })
              )
          '''
          new_identity_request = '''    local target = "/api/projects/internal/content-identity/" .. ngx.escape_uri(project_ref)
              local signed_headers, sign_err = internal_hmac.sign_headers(
                  SERVICE_HMAC_SECRET,
                  "studio-gateway",
                  "GET",
                  target,
                  ""
              )
              if not signed_headers then
                  return nil, "content identity signing failed: " .. (sign_err or "unknown error")
              end
              signed_headers["Accept"] = "application/json"
              signed_headers["Host"] = SERVER_HOSTNAME

              local client = http.new()
              client:set_timeout(2000)
              local response, err = client:request_uri(
                  SERVER_DOMAIN .. target,
                  outbound_tls.apply_internal(SERVER_DOMAIN, {
                      method = "GET",
                      headers = signed_headers,
                      keepalive = true,
                  })
              )
          '''
          if old_identity_request not in identity:
              raise AssertionError("content_project_identity.lua: legacy request block not found")
          identity = identity.replace(old_identity_request, new_identity_request)
          if "NGINX_SHARED_TOKEN" in identity or "X-Shared-Token" in identity or '"studio-nginx"' in identity:
              raise AssertionError("content_project_identity.lua still contains shared-token caller")
          write("studio/nginx/lua/studio_compat/content_project_identity.lua", identity)

          db_helper = read("studio/nginx/lua/cache/project_db_helper.lua")
          db_helper = db_helper.replace(
              'local outbound_tls = require("utils.outbound_tls")\n',
              'local outbound_tls = require("utils.outbound_tls")\nlocal internal_hmac = require("security.internal_hmac")\n',
          )
          db_helper = db_helper.replace(
              'local NGINX_SHARED_TOKEN = os.getenv("NGINX_SHARED_TOKEN")\n',
              'local STUDIO_GATEWAY_HMAC_SECRET = os.getenv("STUDIO_GATEWAY_HMAC_SECRET") or ""\n',
          )
          insertion = '''local function signed_internal_headers(method, target, body, user_token)
              local headers, err = internal_hmac.sign_headers(
                  STUDIO_GATEWAY_HMAC_SECRET,
                  "studio-gateway",
                  method,
                  target,
                  body or ""
              )
              if not headers then return nil, err end
              headers["X-User-Token"] = user_token
              headers["Content-Type"] = "application/json"
              headers["Host"] = SERVER_HOSTNAME
              return headers
          end

          '''
          marker = 'local user_hmac_token = require("security.user_hmac_token")\n\n'
          if marker not in db_helper:
              raise AssertionError("project_db_helper.lua: helper insertion marker not found")
          db_helper = db_helper.replace(marker, marker + insertion, 1)
          old_get = '''    local url = SERVER_DOMAIN .. "/api/projects/" .. project_ref .. "/functions"
              ngx.log(ngx.INFO, "[PROJECT-DB] Fetching AI functions: ", url)
              
              local res, err = httpc:request_uri(url, outbound_tls.apply_internal(url, {
                  method = "GET",
                  headers = {
                      ["X-User-Token"] = user_token,
                      ["Content-Type"] = "application/json",
                      ["X-Shared-Token"] = NGINX_SHARED_TOKEN,
                      ["Host"] = SERVER_HOSTNAME
                  }
              }))
          '''
          new_get = '''    local target = "/api/projects/" .. project_ref .. "/functions"
              local url = SERVER_DOMAIN .. target
              ngx.log(ngx.INFO, "[PROJECT-DB] Fetching AI functions: ", url)
              local request_headers, sign_err = signed_internal_headers("GET", target, "", user_token)
              if not request_headers then
                  return {}, sign_err or "failed to sign internal request"
              end
              
              local res, err = httpc:request_uri(url, outbound_tls.apply_internal(url, {
                  method = "GET",
                  headers = request_headers
              }))
          '''
          if old_get not in db_helper:
              raise AssertionError("project_db_helper.lua: GET legacy block not found")
          db_helper = db_helper.replace(old_get, new_get)
          old_post = '''    local url = SERVER_DOMAIN .. "/api/projects/" .. project_ref .. "/execute-function"
              ngx.log(ngx.INFO, "[PROJECT-DB] Executing function: ", safe_name, " with args: ", cjson.encode(args_object))
              
              local res, err = httpc:request_uri(url, outbound_tls.apply_internal(url, {
                  method = "POST",
                  headers = {
                      ["X-User-Token"] = exec_user_token,
                      ["Content-Type"] = "application/json",
                      ["X-Shared-Token"] = NGINX_SHARED_TOKEN,
                      ["Host"] = SERVER_HOSTNAME
                  },
                  body = cjson.encode({ 
                      function_name = safe_name,
                      arguments = args_object 
                  })
              }))
          '''
          new_post = '''    local target = "/api/projects/" .. project_ref .. "/execute-function"
              local url = SERVER_DOMAIN .. target
              local request_body = cjson.encode({
                  function_name = safe_name,
                  arguments = args_object
              })
              ngx.log(ngx.INFO, "[PROJECT-DB] Executing function: ", safe_name, " with args: ", cjson.encode(args_object))
              local request_headers, sign_err = signed_internal_headers(
                  "POST",
                  target,
                  request_body,
                  exec_user_token
              )
              if not request_headers then
                  return nil, sign_err or "failed to sign internal request"
              end
              
              local res, err = httpc:request_uri(url, outbound_tls.apply_internal(url, {
                  method = "POST",
                  headers = request_headers,
                  body = request_body
              }))
          '''
          if old_post not in db_helper:
              raise AssertionError("project_db_helper.lua: POST legacy block not found")
          db_helper = db_helper.replace(old_post, new_post)
          if "NGINX_SHARED_TOKEN" in db_helper or "X-Shared-Token" in db_helper:
              raise AssertionError("project_db_helper.lua still contains shared-token caller")
          write("studio/nginx/lua/cache/project_db_helper.lua", db_helper)

          # Nginx: remove dead rewrite, bearer injection, and compatibility header clearing.
          nginx = read("studio/nginx/nginx.conf")
          nginx = nginx.replace("env NGINX_SHARED_TOKEN;\n", "")
          nginx, set_count = re.subn(
              r'^\s*set_by_lua_file \$nginx_shared_token /usr/local/openresty/lualib/security/nginx_shared_token\.lua;\n',
              "",
              nginx,
              flags=re.M,
          )
          if set_count != 1:
              raise AssertionError(f"nginx.conf: shared-token variable removal count={set_count}")
