              '            "NGINX_SHARED_TOKEN=test-token\\nPROJECTS_API_PORT=18000\\n",\n',
              '            "PROJECTS_API_PORT=18000\\n",\n',
          )
          traefik_test = traefik_test.replace(
              '            "NGINX_SHARED_TOKEN=test-token\\n"\n            "PROJECTS_API_PORT=18000\\n"\n',
              '            "PROJECTS_API_PORT=18000\\n"\n',
          )
          traefik_test = traefik_test.replace(
              '        self.assertIn("PathPrefix(`/api/internal/analytics`)", result)\n',
              '        self.assertIn("PathPrefix(`/api/internal/analytics`)", result)\n        self.assertNotIn("X-Shared-Token", result)\n',
          )
          write("tests/smoke/test_traefik_guard_migration.py", traefik_test)

          key_test = read("tests/smoke/test_key_generation_contract.py")
          key_test, count = re.subn(
              r'    def test_setup_replaces_shared_transport_secrets_by_key_name\(self\):.*?\n    def test_project_compose_variables_are_defined_by_env_templates',
              '''    def test_setup_and_runtime_config_require_explicit_internal_hmac_keys(self):
                  setup = (ROOT / "setup.sh").read_text(encoding="utf-8")
                  studio_example = (ROOT / "studio" / ".env.example").read_text(encoding="utf-8")
                  server_example = (ROOT / "servidor" / ".env.example").read_text(encoding="utf-8")
                  runtime_tool = (ROOT / "tools" / "configure_studio_runtime.py").read_text(encoding="utf-8")
                  self.assertIn("STUDIO_SERVICE_KEY_ENCRYPTION_KEY=pass", studio_example)
                  self.assertNotIn("NGINX_SHARED_TOKEN", setup + studio_example + server_example)
                  for key in {"STUDIO_GATEWAY_HMAC_SECRET", "PROJECTS_API_HMAC_SECRET"}:
                      self.assertIn(f"{key}=", studio_example)
                      self.assertIn(f"{key}=", server_example)
                      self.assertIn(key, runtime_tool)
                  for key in {"STUDIO_SERVICE_KEY_ENCRYPTION_KEY", "NGINX_HMAC_SECRET", "INTERNAL_HMAC_SECRET"}:
                      self.assertIn(f"s|^{key}=.*|", setup)
                      self.assertIn(f"assert_env_value servidor/.env {key}", setup)
                      self.assertIn(f"assert_env_value studio/.env {key}", setup)

              def test_project_compose_variables_are_defined_by_env_templates''',
              key_test,
              flags=re.S,
          )
          if count != 1:
              raise AssertionError(f"test_key_generation_contract method replacement count={count}")
          write("tests/smoke/test_key_generation_contract.py", key_test)

          storage_router_test = read("tests/smoke/test_storage_platform_router.py")
          if "rewrite ^/object/sign$ /storage/v1/$1 break;" not in storage_router_test:
              insert_at = "class "
              idx = storage_router_test.find(insert_at)
              if idx == -1:
                  raise AssertionError("storage router test class not found")
              # Add an independent top-level contract test through the first class.
              class_name = re.search(r'class ([A-Za-z0-9_]+)\(unittest\.TestCase\):', storage_router_test)
              if not class_name:
                  raise AssertionError("storage router unittest class not found")
              class_marker = class_name.group(0) + "\n"
              method = '''    def test_dead_object_sign_rewrite_is_removed(self) -> None:
                  nginx = (ROOT / "studio/nginx/nginx.conf").read_text(encoding="utf-8")
                  self.assertNotIn("rewrite ^/object/sign$ /storage/v1/$1 break;", nginx)

          '''
              storage_router_test = storage_router_test.replace(class_marker, class_marker + method, 1)
          write("tests/smoke/test_storage_platform_router.py", storage_router_test)

          write("tests/smoke/test_internal_hmac_migration.py", textwrap.dedent('''\
          from __future__ import annotations

          import importlib.util
          import tempfile
          import unittest
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[2]
          MODULE_PATH = ROOT / "tools/migrate_internal_hmac_v1.py"
          spec = importlib.util.spec_from_file_location("migrate_internal_hmac_v1", MODULE_PATH)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)


          class InternalHmacMigrationTest(unittest.TestCase):
              def _files(self, root: Path, server: str, studio: str) -> tuple[Path, Path]:
                  server_path = root / "server.env"
                  studio_path = root / "studio.env"
                  server_path.write_text(server, encoding="utf-8")
                  studio_path.write_text(studio, encoding="utf-8")
                  return server_path, studio_path

              def test_generates_distinct_keys_and_removes_old_assignments(self) -> None:
                  with tempfile.TemporaryDirectory() as tmp:
                      server, studio = self._files(
                          Path(tmp),
                          "NGINX_SHARED_TOKEN=old\\nINTERNAL_HMAC_ALLOW_LEGACY_SHARED_TOKEN=true\\n",
                          "NGINX_SHARED_TOKEN=old\\n",
                      )
                      self.assertTrue(module.migrate(server, studio))
                      server_text = server.read_text(encoding="utf-8")
                      studio_text = studio.read_text(encoding="utf-8")
                      for key in module.REMOVED_KEYS:
                          self.assertNotIn(key, server_text + studio_text)
                      values = []
                      for key in module.SERVICE_KEYS:
                          server_value = module._value(server_text, key)
                          studio_value = module._value(studio_text, key)
                          self.assertEqual(server_value, studio_value)
                          self.assertTrue(server_value)
                          values.append(server_value)
                      self.assertNotEqual(values[0], values[1])
                      self.assertTrue(server.with_name(server.name + ".pre-internal-hmac-v1").exists())

              def test_preserves_existing_explicit_key_without_rotation(self) -> None:
                  with tempfile.TemporaryDirectory() as tmp:
                      existing = "a" * 64
                      server, studio = self._files(
                          Path(tmp),
                          f"STUDIO_GATEWAY_HMAC_SECRET={existing}\\n",
                          "",
                      )
                      module.migrate(server, studio)
                      self.assertEqual(existing, module._value(server.read_text(), "STUDIO_GATEWAY_HMAC_SECRET"))
                      self.assertEqual(existing, module._value(studio.read_text(), "STUDIO_GATEWAY_HMAC_SECRET"))

              def test_fails_on_divergent_explicit_values(self) -> None:
                  with tempfile.TemporaryDirectory() as tmp:
                      server, studio = self._files(
                          Path(tmp),
                          "STUDIO_GATEWAY_HMAC_SECRET=" + "a" * 64 + "\\n",
                          "STUDIO_GATEWAY_HMAC_SECRET=" + "b" * 64 + "\\n",
                      )
                      with self.assertRaises(module.MigrationError):
                          module.migrate(server, studio)


          if __name__ == "__main__":
              unittest.main()
          '''))

          # ------------------------------------------------------------------
          # Current architecture docs: no shared bearer boundary.
          # ------------------------------------------------------------------
          architecture = read("docs/00-arquitetura.md")
          architecture = architecture.replace(
              '''### OpenResty para Projects API

          - `X-Shared-Token` identifica a integração autorizada;
          - `X-User-Token` carrega o UUID do usuário com assinatura HMAC e validade curta;
          - grupos e atributos textuais não substituem a identidade assinada.

          ### Serviços backend para OpenResty

          Integrações como push worker e invalidação de cache usam contratos internos próprios, incluindo identificação do serviço e assinatura ou shared token conforme a rota.
          ''',
              '''### OpenResty para Projects API

          - `internal-hmac-v1` autentica `studio-gateway` e vincula método, path/query, timestamp, nonce e hash do body;
          - `X-User-Token` carrega o UUID do usuário com assinatura HMAC e validade curta;
          - identidade de serviço não substitui autorização do usuário e grupos textuais não substituem identidade assinada.

          ### Serviços backend para OpenResty

          Projects API usa `internal-hmac-v1` com identidade `projects-api`. O push worker mantém seu contrato HMAC `push-v2`, separado do token de usuário.
          ''',
          )
          write("docs/00-arquitetura.md", architecture)

          control = read("docs/architecture/control-plane.md")
          control = control.replace(
              'Usa `X-Shared-Token` e, nas rotas de usuário, `X-User-Token`.\n',
              'Usa `internal-hmac-v1` com identidade `studio-gateway`; nas rotas de usuário, `X-User-Token` continua obrigatório separadamente.\n',
          )
          control = control.replace(
              'A rota valida `X-Shared-Token` e `X-Internal-Service: projects-api`.\n',
              'A rota valida `internal-hmac-v1` com `X-Internal-Service: projects-api`, timestamp, nonce e hash do body.\n',
          )
          write("docs/architecture/control-plane.md", control)

          openresty_doc = read("docs/architecture/openresty-lua.md")
          openresty_doc = openresty_doc.replace(
              'O endpoint exige `X-Shared-Token` e `X-Internal-Service: projects-api`, remove\na chave anterior e publica a nova versão mínima no shared dictionary. A\n',
              'O endpoint exige `internal-hmac-v1` com `X-Internal-Service: projects-api`, remove\na chave anterior e publica a nova versão mínima no shared dictionary. A\n',
          )
          write("docs/architecture/openresty-lua.md", openresty_doc)

          errors_doc = read("docs/05-principais-erros.md")
          errors_doc = errors_doc.replace(
              '- `NGINX_SHARED_TOKEN` nos dois lados;\n',
              '- `STUDIO_GATEWAY_HMAC_SECRET` e `PROJECTS_API_HMAC_SECRET` sincronizados entre os dois lados e distintos entre si;\n',
          )
          write("docs/05-principais-erros.md", errors_doc)

          changelog = read("CHANGELOG.md")
          cutover_note = '''## 2026-08-17 — Cutover HMAC interno estrito

          - removido `NGINX_SHARED_TOKEN` do runtime, Traefik e OpenResty;
          - removido o middleware bearer legado e qualquer fallback por derivação;
          - `STUDIO_GATEWAY_HMAC_SECRET` e `PROJECTS_API_HMAC_SECRET` passam a ser obrigatórios e independentes;
          - instalações existentes devem executar `python3 tools/migrate_internal_hmac_v1.py` antes do rebuild/restart;
          - removida a regra morta `rewrite ^/object/sign$ /storage/v1/$1 break;`.

          '''
          if "## 2026-08-17 — Cutover HMAC interno estrito" not in changelog:
              changelog = cutover_note + changelog
          write("CHANGELOG.md", changelog)

          # Hard assertions over runtime/config paths. Migration/tests may name removed keys intentionally.
          forbidden_runtime = (
              "NGINX_SHARED_TOKEN",
              "X-Shared-Token",
              "INTERNAL_HMAC_ALLOW_LEGACY_SHARED_TOKEN",
              "X-Internal-Caller",
              "security.shared_token",
              "nginx_shared_token",
              "rewrite ^/object/sign$ /storage/v1/$1 break;",
          )
          runtime_paths = [
              ROOT / "servidor/api-internal/app",
              ROOT / "servidor/traefik",
              ROOT / "studio/nginx",
              ROOT / "servidor/docker-compose-api.yml",
              ROOT / "servidor/.env.example",
              ROOT / "studio/.env.example",
              ROOT / "setup.sh",
              ROOT / "servidor/verify_key_config.sh",
          ]
          for item in runtime_paths:
              paths = [item] if item.is_file() else [p for p in item.rglob("*") if p.is_file()]
              for path in paths:
                  try:
                      source = path.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      continue
                  for token in forbidden_runtime:
                      if token in source:
                          raise AssertionError(f"legacy runtime token {token!r} remains in {path.relative_to(ROOT)}")

          print("strict HMAC cutover patch applied")
          PY

