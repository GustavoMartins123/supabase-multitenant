name: Temporary strict internal HMAC cutover v5

on:
  push:
    branches: [opaque-keys]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: opaque-keys
          fetch-depth: 1

      - name: Apply strict cutover and normalize smoke helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/tmp-apply-hard-hmac-cutover-v4.yml').read_text(encoding='utf-8')
          section = workflow.split('      - name: Run corrected cutover applicator\n', 1)[1]
          section = section.split('      - name: Validate Python and static smoke contracts\n', 1)[0]
          body = section.split('        run: |\n', 1)[1]
          lines = body.splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/apply-v4.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/apply-v4.sh

          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          path = Path('tests/smoke/common.py')
          source = path.read_text(encoding='utf-8')
          replacement = textwrap.dedent('''\
          def request(
              method: str,
              url: str,
              *,
              headers: dict[str, str] | None = None,
              payload: dict[str, Any] | None = None,
              raw_body: bytes | None = None,
              timeout: float = 30,
              sign_internal: bool = True,
          ) -> tuple[int, Any]:
              body = raw_body
              request_headers = dict(headers or {})
              if payload is not None:
                  body = json.dumps(payload, separators=(",", ":")).encode()
                  request_headers.setdefault("Content-Type", "application/json")

              if sign_internal:
                  api_base = os.getenv("SMOKE_API_URL", "").rstrip("/")
                  service_secret = os.getenv("SMOKE_STUDIO_GATEWAY_HMAC_SECRET", "")
                  if api_base and service_secret and (url == api_base or url.startswith(api_base + "/")):
                      request_headers.update(
                          build_internal_service_headers(
                              service_secret,
                              method,
                              url,
                              body or b"",
                          )
                      )

              req = urllib.request.Request(
                  url,
                  data=body,
                  headers=request_headers,
                  method=method,
              )
              try:
                  with urllib.request.urlopen(
                      req,
                      timeout=timeout,
                      context=ssl_context(),
                  ) as response:
                      status = response.status
                      response_body = response.read()
              except urllib.error.HTTPError as exc:
                  status = exc.code
                  response_body = exc.read()

              text = response_body.decode(errors="replace")
              try:
                  return status, json.loads(text) if text else None
              except json.JSONDecodeError:
                  return status, text


          def wait_for_job(
          ''')
          source, count = re.subn(
              r'def request\(.*?\n\ndef wait_for_job\(\n',
              replacement,
              source,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'common.py request function replacement count={count}')
          path.write_text(source, encoding='utf-8')
          PY

      - name: Validate Python and static smoke contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q servidor/api-internal/app tools tests/smoke
          python3 -m unittest \
            tests.smoke.test_internal_hmac_migration \
            tests.smoke.test_traefik_guard_migration \
            tests.smoke.test_studio_runtime_contract \
            tests.smoke.test_key_generation_contract \
            tests.smoke.test_service_key_cache_contract \
            tests.smoke.test_storage_platform_router
          git diff --check

      - name: Validate HMAC Python contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q -r servidor/api-internal/requirements.txt
          python3 -m unittest tests.smoke.test_hmac_contracts

      - name: Commit strict cutover
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Gustavo Henrique Martins"
          git config user.email "99695758+GustavoMartins123@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "security: remove legacy shared-token authentication"
          git push origin HEAD:opaque-keys
