name: Temporary strict internal HMAC cutover v4

on:
  push:
    branches: [opaque-keys]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: opaque-keys
          fetch-depth: 1

      - name: Run corrected cutover applicator
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          workflow = Path('.github/workflows/tmp-apply-hard-hmac-cutover.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          lines = workflow[start:end].splitlines()
          source = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"

          sign_block_text = '''    if sign_internal:
              api_base = os.getenv("SMOKE_API_URL", "").rstrip("/")
              service_secret = os.getenv("SMOKE_STUDIO_GATEWAY_HMAC_SECRET", "")
              if api_base and service_secret and (url == api_base or url.startswith(api_base + "/")):
                  request_headers.update(
                      build_internal_service_headers(
                          service_secret,
                          method,
                          url,
                          body or b"",
                      )
                  )
          '''
          anchor_text = "    req = urllib.request.Request(\n"
          common_replacement = (
              "sign_block = " + repr(sign_block_text) + "\n"
              "anchor = " + repr(anchor_text) + "\n"
              "if common.count(anchor) != 1:\n"
              "    raise AssertionError(f\"common.py request anchor count={common.count(anchor)}\")\n"
              "common = common.replace(anchor, sign_block + anchor, 1)\n"
              "write(\"tests/smoke/common.py\", common)"
          )
          source, count = re.subn(
              r'request_marker = .*?write\("tests/smoke/common\.py", common\)',
              lambda _: common_replacement,
              source,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'could not patch common smoke block: {count}')

          live_source = '''from __future__ import annotations

          import json
          import os
          import time
          import unittest

          from tests.smoke.common import (
              build_internal_push_headers,
              build_internal_service_headers,
              build_user_token,
              env_flag,
              request,
          )


          @unittest.skipUnless(env_flag("RUN_HMAC_SMOKE"), "set RUN_HMAC_SMOKE=1")
          class LiveHmacSmokeTest(unittest.TestCase):
              def test_user_hmac_accepts_valid_and_rejects_tampered_token(self) -> None:
                  api_url = os.environ["SMOKE_API_URL"].rstrip("/")
                  user_id = os.environ["SMOKE_USER_ID"]
                  secret = os.environ["SMOKE_NGINX_HMAC_SECRET"]
                  os.environ["SMOKE_STUDIO_GATEWAY_HMAC_SECRET"]
                  token = build_user_token(secret, user_id)
                  headers = {"X-User-Token": token}
                  status, body = request(
                      "GET",
                      f"{api_url}/api/projects",
                      headers=headers,
                  )
                  self.assertEqual(status, 200, body)

                  bad_headers = dict(headers)
                  bad_headers["X-User-Token"] = token[:-1] + (
                      "0" if token[-1] != "0" else "1"
                  )
                  status, _ = request(
                      "GET",
                      f"{api_url}/api/projects",
                      headers=bad_headers,
                  )
                  self.assertEqual(status, 401)

              def test_service_hmac_rejects_tamper_expiration_and_replay(self) -> None:
                  api_url = os.environ["SMOKE_API_URL"].rstrip("/")
                  service_secret = os.environ["SMOKE_STUDIO_GATEWAY_HMAC_SECRET"]
                  user_token = build_user_token(
                      os.environ["SMOKE_NGINX_HMAC_SECRET"],
                      os.environ["SMOKE_USER_ID"],
                  )
                  url = f"{api_url}/api/projects"
                  timestamp = int(time.time())
                  nonce = os.urandom(16).hex()
                  signed = {
                      "X-User-Token": user_token,
                      **build_internal_service_headers(
                          service_secret,
                          "GET",
                          url,
                          timestamp=timestamp,
                          nonce=nonce,
                      ),
                  }

                  tampered = dict(signed)
                  tampered["X-Internal-Signature"] = "0" * 64
                  status, _ = request("GET", url, headers=tampered, sign_internal=False)
                  self.assertEqual(status, 403)

                  expired = {
                      "X-User-Token": user_token,
                      **build_internal_service_headers(
                          service_secret,
                          "GET",
                          url,
                          timestamp=timestamp - 600,
                      ),
                  }
                  status, _ = request("GET", url, headers=expired, sign_internal=False)
                  self.assertEqual(status, 401)

                  first_status, _ = request("GET", url, headers=signed, sign_internal=False)
                  self.assertEqual(first_status, 200)
                  replay_status, _ = request("GET", url, headers=signed, sign_internal=False)
                  self.assertEqual(replay_status, 401)

              def test_internal_push_hmac_rejects_tamper_and_replay(self) -> None:
                  push_url = os.environ["SMOKE_PUSH_URL"]
                  secret = os.environ["SMOKE_INTERNAL_HMAC_SECRET"]
                  payload = {
                      "project": os.getenv("SMOKE_PUSH_PROJECT", "smoke_project"),
                      "token": os.getenv("SMOKE_PUSH_TOKEN", "invalid-smoke-token"),
                      "body": "HMAC smoke test",
                  }
                  body = json.dumps(payload, separators=(",", ":")).encode()
                  nonce = os.urandom(16).hex()
                  timestamp = int(time.time())
                  signed_headers = {
                      "Content-Type": "application/json",
                      **build_internal_push_headers(
                          secret,
                          push_url,
                          body,
                          timestamp=timestamp,
                          nonce=nonce,
                      ),
                  }

                  tampered_status, _ = request(
                      "POST",
                      push_url,
                      headers=signed_headers,
                      raw_body=body + b" ",
                      sign_internal=False,
                  )
                  self.assertEqual(tampered_status, 403)

                  first_status, _ = request(
                      "POST",
                      push_url,
                      headers=signed_headers,
                      raw_body=body,
                      sign_internal=False,
                  )
                  self.assertNotIn(first_status, {401, 403, 405})

                  replay_status, _ = request(
                      "POST",
                      push_url,
                      headers=signed_headers,
                      raw_body=body,
                      sign_internal=False,
                  )
                  self.assertEqual(replay_status, 401)


          if __name__ == "__main__":
              unittest.main()
          '''
          import textwrap
          live_source = textwrap.dedent(live_source)
          live_replacement = (
              "live = " + repr(live_source) + "\n"
              "write(\"tests/smoke/test_live_hmac.py\", live)"
          )
          source, count = re.subn(
              r'live = read\("tests/smoke/test_live_hmac\.py"\).*?write\("tests/smoke/test_live_hmac\.py", live\)',
              lambda _: live_replacement,
              source,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'could not patch live smoke block: {count}')

          exec(compile(source, '<strict-hmac-cutover>', 'exec'), {})
          PY

      - name: Validate Python and static smoke contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q servidor/api-internal/app tools tests/smoke
          python3 -m unittest \
            tests.smoke.test_internal_hmac_migration \
            tests.smoke.test_traefik_guard_migration \
            tests.smoke.test_studio_runtime_contract \
            tests.smoke.test_key_generation_contract \
            tests.smoke.test_service_key_cache_contract \
            tests.smoke.test_storage_platform_router
          git diff --check

      - name: Validate HMAC Python contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q -r servidor/api-internal/requirements.txt
          python3 -m unittest tests.smoke.test_hmac_contracts

      - name: Commit strict cutover
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Gustavo Henrique Martins"
          git config user.email "99695758+GustavoMartins123@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "security: remove legacy shared-token authentication"
          git push origin HEAD:opaque-keys
