env INTERNAL_HMAC_SECRET;
worker_processes 4;
error_log /tmp/push-error.log warn;
pid /tmp/push-nginx.pid;
events { worker_connections 256; }
http {
    lua_package_path '/workspace/studio/nginx/lua/?.lua;;';
    lua_shared_dict push_oauth_tokens 1m;
    lua_shared_dict push_idempotency 10m;
    lua_shared_dict push_locks 1m;
    lua_shared_dict test_stats 1m;
    lua_shared_dict internal_hmac_nonces 1m;
    lua_ssl_trusted_certificate /config/test.crt;
    lua_ssl_verify_depth 4;
    init_by_lua_block { dofile('/workspace/tests/push/openresty/mock_google.lua') }
    server {
        listen 8443 ssl;
        ssl_certificate /config/test.crt;
        ssl_certificate_key /config/test.key;
        access_log off;
        location = /api/internal/push {
            client_max_body_size 32k;
            client_body_buffer_size 32k;
            access_by_lua_file /workspace/studio/nginx/lua/security/check_push_worker.lua;
            content_by_lua_file /workspace/studio/nginx/lua/send_push.lua;
        }
        location = /test/reset {
            content_by_lua_block {
                for _,name in ipairs({'push_oauth_tokens','push_idempotency','push_locks','test_stats','internal_hmac_nonces'}) do
                    ngx.shared[name]:flush_all();ngx.shared[name]:flush_expired()
                end
                ngx.say('{}')
            }
        }
        location = /test/legacy-push {
            access_by_lua_file /workspace/studio/nginx/lua/security/check_push_worker.lua;
            content_by_lua_file /baseline/send_push.lua;
        }
        location = /test/state {
            content_by_lua_block {
                ngx.say(require('cjson.safe').encode({oauth=ngx.shared.test_stats:get('oauth_calls') or 0,
                    fcm=ngx.shared.test_stats:get('fcm_calls') or 0, pid=ngx.worker.pid(), nonce_ttl=ngx.shared.internal_hmac_nonces:ttl('push-worker:'..(ngx.var.arg_nonce or ''))}))
            }
        }
        location = /test/oauth-fail {
            content_by_lua_block { ngx.shared.test_stats:set('oauth_mode','fail');ngx.say('{}') }
        }
        location = /test/oauth-delay {
            content_by_lua_block { ngx.shared.test_stats:set('oauth_delay',.5);ngx.say('{}') }
        }
        location = /test/inspect-logs {
            content_by_lua_block {
                local f=io.open('/tmp/push-error.log');ngx.say(f:read('*a'));f:close()
            }
        }
        location = /test/lua-tls {
            content_by_lua_block {
                local h=require('push_test_real_http').new()
                h:set_timeouts(1000,1000,1000)
                local port=ngx.var.arg_mode=='untrusted' and '8444' or '8443'
                local r,err=h:request_uri('https://127.0.0.1:'..port..'/test/state',{
                    ssl_verify=true,ssl_server_name=ngx.var.arg_mode=='wronghost' and 'other.test' or 'localhost'})
                ngx.say(require('cjson.safe').encode({verified=r~=nil,reason=err}))
            }
        }
    }
    server {
        listen 8444 ssl;
        ssl_certificate /config/untrusted.crt;
        ssl_certificate_key /config/untrusted.key;
        access_log off;
        location / { return 200 '{}'; }
    }
}
