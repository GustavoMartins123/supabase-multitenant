daemon off;
worker_processes 2;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;
events { worker_connections 64; }
env PROJECTS_API_HMAC_SECRET;
env STUDIO_GATEWAY_HMAC_SECRET;
env SERVER_DOMAIN;
env NGINX_HMAC_SECRET;
http {
  lua_package_path '/workspace/studio/nginx/lua/?.lua;;';
  lua_shared_dict users_cache 1m;
  lua_shared_dict internal_hmac_nonces 1m;
  init_by_lua_block {
    -- Only Authelia's ID-export subprocess is mocked in this boundary harness.
    package.loaded['admin_api.authelia_identifiers']={ensure_identifier=function(username)
      local hash=ngx.md5(username)
      return hash:sub(1,8)..'-'..hash:sub(9,12)..'-'..hash:sub(13,16)..'-'..hash:sub(17,20)..'-'..hash:sub(21,32)
    end}
  }
  init_worker_by_lua_file /workspace/studio/nginx/lua/init/init_worker.lua;
  server {
    listen 8080;
    set $auth_user_id '';
    set $auth_user_token '';
    location = /internal/users/directory {
      content_by_lua_file /workspace/studio/nginx/lua/admin_api/directory_read.lua;
    }
    location = /test/seed {
      content_by_lua_block {
        ngx.req.read_body()
        local data=assert(require('cjson.safe').decode(ngx.req.get_body_data()))
        assert(require('admin_api.authelia_user_store').with_lock(function()
          return require('admin_api.authelia_user_store').write(data)
        end))
        ngx.say('seeded')
      }
    }
    location = /test/actor {
      content_by_lua_block {
        local id, groups=require('project_context.user_context_headers').apply('admin@example.test','admin,active')
        ngx.say(require('cjson.safe').encode({id=id, groups=groups, token=ngx.var.auth_user_token}))
      }
    }
    location = /test/outage {
      content_by_lua_block {
        local file=assert(io.open('/config/test-outage', 'wb'))
        file:write(ngx.var.arg_enabled or ''); file:close(); ngx.say('set')
      }
    }
    location = /test/sync-state {
      content_by_lua_block {
        local file=io.open('/config/test-ack', 'rb')
        if not file then return ngx.exit(404) end
        ngx.print(file:read('*a')); file:close()
      }
    }
    location = /api/projects/internal/users/sync {
      content_by_lua_block {
        local hmac=require('security.internal_hmac')
        local verified,status=hmac.verify_current_request(os.getenv('STUDIO_GATEWAY_HMAC_SECRET'), 'studio-nginx')
        if not verified then return ngx.exit(status) end
        local flag=io.open('/config/test-outage','rb')
        local outage=flag and flag:read('*a') == '1'
        if flag then flag:close() end
        if outage then return ngx.exit(503) end
        local snapshot=assert(require('cjson.safe').decode(hmac.read_current_body()))
        local file=assert(io.open('/config/test-ack','wb'))
        file:write(snapshot.revision); file:close()
        ngx.say(require('cjson.safe').encode({revision=snapshot.revision,users=snapshot.users}))
      }
    }
  }
}
