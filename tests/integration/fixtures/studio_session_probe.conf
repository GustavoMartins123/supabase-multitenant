# Test-only handlers; server rewrite, auth_request and Authelia proxy are production.
location = /api/csrf-probe {
    content_by_lua_block {
        require('security.csrf').require_json()
        ngx.header['Content-Type'] = 'application/json'
        ngx.say(require('cjson.safe').encode({actor=ngx.var.authelia_username}))
    }
}
location = /session-test {
    auth_request off;
    default_type text/html;
    return 200 '<!doctype html><title>Session test</title>';
}
