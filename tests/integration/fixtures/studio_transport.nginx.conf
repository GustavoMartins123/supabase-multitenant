worker_processes 1;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;
events { worker_connections 64; }
env SERVER_DOMAIN;
http {
  lua_package_path '/workspace/studio/nginx/lua/?.lua;;';
  init_by_lua_block {
    -- Authorization/crypto are tested separately against the real API/Postgres.
    -- This harness isolates real OpenResty rewrite/access/proxy phase ordering.
    package.loaded["security.project_access"] = {
      enforce_admin = function()
        if ngx.req.get_headers()["X-Test-Actor"] ~= "admin" then
          return ngx.exit(403)
        end
        local ref = require("project_context.request_context").capture()
        return {ref=ref, file_size_limit=500000}
      end
    }
    package.loaded["security.studio_administrative_key"] = {
      load = function() return "sb_secret_harness_only" end
    }
    package.loaded["security.storage_upload_limit"] = {enforce=function() end}
  }
  server {
    listen 8080;
    set $server_path '';
    set $project_ref '';
    location ~ "^/api/platform/projects/[a-z_][a-z0-9_]{2,39}/api/rest(.*)$" {
      set $target_rest_path '';
      rewrite_by_lua_file /workspace/studio/nginx/lua/proxy_rewrites/rest_v1.lua;
      access_by_lua_file /workspace/studio/nginx/lua/security/inject_service_key.lua;
      proxy_pass $server_path$target_rest_path$is_args$args;
    }
    location ~ "^/api/platform/projects/[a-z_][a-z0-9_]{2,39}/api/graphql/?$" {
      rewrite_by_lua_file /workspace/studio/nginx/lua/proxy_rewrites/graphql.lua;
      access_by_lua_file /workspace/studio/nginx/lua/security/inject_service_key_graphql.lua;
      proxy_pass $server_path$uri$is_args$args;
    }
    location /demo/ {
      content_by_lua_block {
        local h=ngx.req.get_headers()
        ngx.header.content_type="application/json"
        ngx.say(require("cjson").encode({uri=ngx.var.uri, args=ngx.var.args,
          opaque=h.apikey=="sb_secret_harness_only",
          administrative=h.Authorization=="Bearer sb_secret_harness_only"}))
      }
    }
  }
}
