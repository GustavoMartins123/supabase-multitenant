daemon off;
worker_processes 2;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;
events { worker_connections 64; }
http {
  lua_package_path '/workspace/studio/nginx/lua/?.lua;;';
  server {
    listen 8443 ssl;
    ssl_certificate /config/test.crt;
    ssl_certificate_key /config/test.key;
    server_rewrite_by_lua_block { require('security.csrf').enforce() }
    location = / { return 200 'legitimate'; }
    location = /api/mutate {
      content_by_lua_block {
        require('security.csrf').require_json()
        if ngx.var.cookie_session ~= 'synthetic-valid-cookie' then return ngx.exit(401) end
        ngx.say('mutated')
      }
    }
    location = /api/internal/push { return 204; }
    location = /object/sign { return 410; }
  }
  server {
    listen 8444 ssl;
    ssl_certificate /config/test.crt;
    ssl_certificate_key /config/test.key;
    location = / {
      default_type text/html;
      return 200 '<form method="POST" action="https://localhost:55443/api/mutate" target="result"><input name="action" value="disable"></form><iframe name="result"></iframe>';
    }
  }
}
