worker_processes 2;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;
events { worker_connections 64; }
env STUDIO_BOOTSTRAP_TOKEN_FILE;
http {
  lua_package_path '/workspace/studio/nginx/lua/?.lua;;';
  lua_shared_dict users_cache 1m;
  init_by_lua_block {
    -- External password hashing/identity/sync are independent of this boundary.
    package.loaded["security.argon2_password"]={hash_password=function() return "$argon2id$test" end}
    package.loaded["admin_api.authelia_identifiers"]={ensure_identifier=function() return "11111111-1111-4111-8111-111111111111" end}
    package.loaded["admin_api.user_sync"]={sync_user=function() return {id="11111111-1111-4111-8111-111111111111"} end}
  }
  server {
    listen 8080;
    set $bootstrap_admin true;
    location = /api/bootstrap/admin {
      content_by_lua_file /workspace/studio/nginx/lua/admin_api/user_signup.lua;
    }
    location = /api/bootstrap/status {
      content_by_lua_file /workspace/studio/nginx/lua/admin_api/bootstrap_status.lua;
    }
    location = /test/delete-users {
      content_by_lua_block {
        local store=require("admin_api.authelia_user_store")
        assert(store.with_lock(function() return store.write({users={}}) end))
        ngx.say("cleared")
      }
    }
  }
}
