[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  "studio/lyaml-6.2.8-1.src",
]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
show_error_codes = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
